<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uchi — éditeur</title>
    <!-- Meme logo, en data URI : l'onglet n'attend aucun fichier. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 75 74'%3E%3Cpath fill='%2360a59d' d='M68.87,22.61c-1.73-3.75-4.1-7.14-6.98-10.02,2.88,2.88,5.24,6.28,6.96,10.02h.02Z'/%3E%3Cpath fill='%2360a59d' d='M71.98,36.98c0,.86-.04,1.7-.1,2.55h.05c.06-.83.1-1.66.1-2.5s-.04-1.73-.11-2.59h-.04c.06.84.1,1.69.1,2.55Z'/%3E%3Cpath fill='%2360a59d' d='M68.85,51.34h-22.54c-4.54,0-8.17-1.35-10.89-4.06-2.72-2.71-4.07-6.31-4.07-10.81,0-4.48,1.32-7.91,3.96-10.29,2.64-2.38,6.43-3.57,11.38-3.57h22.16c-1.72-3.75-4.08-7.14-6.96-10.02-6.25-6.23-14.87-10.09-24.39-10.09-19.07,0-34.52,15.46-34.52,34.52,0,9.52,3.86,18.14,10.09,24.39,6.25,6.23,14.87,10.09,24.39,10.09,13.94,0,25.94-8.27,31.39-20.16Z'/%3E%3Cpath fill='%23426060' d='M43.08,37.02c0,1.67,1.21,2.5,3.64,2.5h25.16c.06-.84.1-1.69.1-2.55s-.04-1.7-.1-2.55h-25.16c-2.43,0-3.64.86-3.64,2.59Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <span class="marque">
    <!-- Le logo est ecrit ici plutot que charge : l'editeur ne demande
         aucune image au serveur, et la page reste lisible hors ligne.
         Source : logo_uchi.svg a la racine du depot. -->
    <svg class="logo" viewBox="0 0 75 74" width="20" height="20"
         aria-hidden="true" focusable="false">
      <path fill="#60a59d" d="M68.87,22.61c-1.73-3.75-4.1-7.14-6.98-10.02,2.88,2.88,5.24,6.28,6.96,10.02h.02Z"/>
      <path fill="#60a59d" d="M71.98,36.98c0,.86-.04,1.7-.1,2.55h.05c.06-.83.1-1.66.1-2.5s-.04-1.73-.11-2.59h-.04c.06.84.1,1.69.1,2.55Z"/>
      <path fill="#60a59d" d="M68.85,51.34h-22.54c-4.54,0-8.17-1.35-10.89-4.06-2.72-2.71-4.07-6.31-4.07-10.81,0-4.48,1.32-7.91,3.96-10.29,2.64-2.38,6.43-3.57,11.38-3.57h22.16c-1.72-3.75-4.08-7.14-6.96-10.02-6.25-6.23-14.87-10.09-24.39-10.09-19.07,0-34.52,15.46-34.52,34.52,0,9.52,3.86,18.14,10.09,24.39,6.25,6.23,14.87,10.09,24.39,10.09,13.94,0,25.94-8.27,31.39-20.16Z"/>
      <path fill="#426060" d="M43.08,37.02c0,1.67,1.21,2.5,3.64,2.5h25.16c.06-.84.1-1.69.1-2.55s-.04-1.7-.1-2.55h-25.16c-2.43,0-3.64.86-3.64,2.59Z"/>
    </svg>
    <span class="nom" id="langue">Uchi</span>
  </span>
  <span class="racine" id="racine" title="Dossier de travail"></span>
  <span class="file" id="titre">—</span>
  <span class="etat" id="etat"></span>
  <span class="actions">
    <button id="nouveau" title="Créer un fichier (Ctrl+N)">Nouveau</button>
    <button id="enregistrer" title="Enregistrer (Ctrl+S)">Enregistrer</button>
    <button id="verifier" title="Analyser sans exécuter">Analyser</button>
    <button id="executer" class="principal" title="Exécuter le tampon (Ctrl+Entrée)">Exécuter</button>
  </span>
</header>

<main class="corps">
  <aside class="panneau">
    <input id="filtre" type="search" placeholder="Filtrer…" autocomplete="off" spellcheck="false">
    <ul id="arbre" class="arbre"></ul>
  </aside>

  <div class="colonne">
    <section class="editeur">
      <div class="gouttiere" id="gouttiere" aria-hidden="true"></div>
      <div class="zone">
        <pre class="surcouche" id="surcouche" aria-hidden="true"></pre>
        <textarea id="saisie" spellcheck="false" autocomplete="off" autocapitalize="off"
          autocorrect="off" wrap="off" aria-label="Code Uchi"></textarea>
      </div>
    </section>

    <section class="console" id="console">
      <div class="console-bar">
        <button id="replier" class="discret" title="Replier la sortie">▾</button>
        <span class="console-titre">Sortie</span>
        <span id="resume" class="resume"></span>
        <button id="effacer" class="discret" title="Effacer la sortie">Effacer</button>
      </div>
      <pre id="sortie" class="sortie"></pre>
      <div id="erreur" class="erreur" hidden>
        <p id="erreur-titre" class="erreur-titre"></p>
        <div id="cadres" class="cadres"></div>
      </div>
    </section>
  </div>
</main>

<footer class="statut">
  <span id="position">Ln 1, Col 1</span>
  <span id="taille">0 caractère</span>
  <span id="diagnostic" class="diagnostic"></span>
</footer>

<script src="/highlight.js"></script>
<script src="/app.js"></script>
</body>
</html>
