<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uchi — éditeur</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <span class="marque">
    <img class="logo" src="/icon.svg" alt="" width="20" height="20">
    <span class="nom" id="langue">Uchi</span>
  </span>
  <span class="racine" id="racine" title="Dossier de travail"></span>
  <span class="file" id="titre">—</span>
  <span class="etat" id="etat"></span>
  <span class="actions">
    <button id="nouveau" title="Créer un fichier (Ctrl+N)">Nouveau</button>
    <button id="enregistrer" title="Enregistrer (Ctrl+S)">Enregistrer</button>
    <button id="verifier" title="Analyser sans exécuter">Analyser</button>
    <button id="executer" class="principal" title="Exécuter le tampon (Ctrl+Entrée)">Exécuter</button>
  </span>
</header>

<main class="corps">
  <aside class="panneau">
    <input id="filtre" type="search" placeholder="Filtrer…" autocomplete="off" spellcheck="false">
    <ul id="arbre" class="arbre"></ul>
  </aside>

  <div class="colonne">
    <section class="editeur">
      <div class="gouttiere" id="gouttiere" aria-hidden="true"></div>
      <div class="zone">
        <pre class="surcouche" id="surcouche" aria-hidden="true"></pre>
        <textarea id="saisie" spellcheck="false" autocomplete="off" autocapitalize="off"
          autocorrect="off" wrap="off" aria-label="Code Uchi"></textarea>
      </div>
    </section>

    <section class="console" id="console">
      <div class="console-bar">
        <button id="replier" class="discret" title="Replier la sortie">▾</button>
        <span class="console-titre">Sortie</span>
        <span id="resume" class="resume"></span>
        <button id="effacer" class="discret" title="Effacer la sortie">Effacer</button>
      </div>
      <pre id="sortie" class="sortie"></pre>
      <div id="erreur" class="erreur" hidden>
        <p id="erreur-titre" class="erreur-titre"></p>
        <div id="cadres" class="cadres"></div>
      </div>
    </section>
  </div>
</main>

<footer class="statut">
  <span id="position">Ln 1, Col 1</span>
  <span id="taille">0 caractère</span>
  <span id="diagnostic" class="diagnostic"></span>
</footer>

<script src="/highlight.js"></script>
<script src="/app.js"></script>
</body>
</html>
